[package]
name = "termodoro"
version = "0.1.0"
edition = "2021"
# Minimum Supported Rust Version. Enforced by cargo on build; driven by
# notify-rust 4.18 (rust-version 1.89) and std::u32::is_multiple_of (1.87).
rust-version = "1.89"
default-run = "termodoro"
authors = ["Aman Ali Pogaku <pamanalionline@gmail.com>"]
description = "A sleek, feature-rich Pomodoro timer and task manager for the terminal."
license = "GPL-3.0-or-later"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
notify-rust = "4.11"
directories = "5.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
rodio = { version = "0.19", default-features = false, features = ["wav"] }
unicode-width = "0.2"

[dev-dependencies]
# Property-based testing: generates hundreds of randomized inputs per
# property and shrinks any failure to a minimal reproducing case.
proptest = "1"

# Workspace-level lint enforcement: forbid any `unsafe` block anywhere in the
# crate (including the screenshot generator bin). This replaces the old
# fragile `grep -rn "unsafe" src/` CI check that false-positived on comments
# and doc text mentioning the word.
[lints.rust]
unsafe_code = "forbid"

