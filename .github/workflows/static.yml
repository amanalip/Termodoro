name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate Website Files & Screenshot Assets
        run: |
          test -f ./docs/index.html
          test -f ./docs/features.html
          test -f ./docs/faqs.html
          test -f ./docs/style.css
          test -f ./docs/app.js
          test -f ./docs/favicon.svg
          test -f ./docs/assets/screenshots/01_timer_view.svg
          test -f ./docs/assets/screenshots/02_tasks_view.svg
          test -f ./docs/assets/screenshots/02_task_manager.svg
          test -f ./docs/assets/screenshots/03_stats_view.svg
          test -f ./docs/assets/screenshots/04_settings_view.svg
          test -f ./docs/assets/screenshots/05_task_modal.svg
          test -f ./docs/assets/screenshots/06_help_modal.svg
          echo "All website pages, stylesheets, and screenshots verified!"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
