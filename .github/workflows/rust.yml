# Workflow Name displayed in GitHub Actions tab
name: Rust Continuous Integration & Quality Assurance

# Define triggers that automatically execute this CI pipeline
on:
  # Trigger workflow on git push to the main branch
  push:
    # Target branches
    branches: [ "main" ]
  # Trigger workflow on pull requests targeting the main branch
  pull_request:
    # Target branches
    branches: [ "main" ]

# Global environment variables applied to all jobs and steps
env:
  # Force Cargo to output colored terminal text for enhanced readability in logs
  CARGO_TERM_COLOR: always
  # Ensure backtraces are captured and printed if an assertion fails
  RUST_BACKTRACE: 1

# Define automated execution jobs
jobs:
  # Multi-platform matrix build, lint, and test validation job
  test:
    # Human-readable job name displayed in GitHub UI with OS name
    name: Test Suite (311 Tests) on ${{ matrix.os }}
    # Matrix strategy testing across all 3 major desktop operating systems
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # Target runner virtual machine operating system
    runs-on: ${{ matrix.os }}

    # Ordered list of sequence steps to execute within the job
    steps:
      # Step 1: Check out git repository source code into the runner workspace
      - name: Check out repository code
        # Official GitHub Actions checkout action
        uses: actions/checkout@v4

      # Step 2: Install required Linux development headers for audio (Linux only)
      - name: Install Linux audio and system libraries
        if: runner.os == 'Linux'
        # Update apt package index and install ALSA audio dev packages for Rodio sound playback
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      # Step 3: Install Rust toolchain with cargo components
      - name: Set up Rust toolchain
        # dtolnay rust toolchain action with stable channel
        uses: dtolnay/rust-toolchain@stable
        # Toolchain configuration options
        with:
          # Include clippy for linting and rustfmt for format checks
          components: clippy, rustfmt

      # Step 4: Verify source code formatting compliance
      - name: Verify code formatting with rustfmt
        # Check that all Rust code conforms to canonical style without making modifications
        run: cargo fmt --all -- --check

      # Step 5: Run compiler lint checks with Clippy
      - name: Run Clippy lints
        # Execute clippy analyzer across all targets and treat warnings as fatal errors
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Step 6: Security & Privacy Audit: Verify zero network crates
      # (Unsafe-code enforcement now lives in Cargo.toml as
      # [lints.rust] unsafe_code = "forbid", which is compile-time accurate and
      # cannot false-positive on comments or doc text like the old grep did.)
      - name: Verify Zero Network Dependencies
        shell: bash
        run: |
          # Verify Cargo.lock contains zero HTTP/network client libraries (reqwest, ureq, hyper, curl, tungstenite, tokio-tungstenite)
          ! grep -E "^name = \"(reqwest|ureq|hyper|curl|tungstenite|tokio-tungstenite|sentry|datadog|posthog)\"" Cargo.lock

      # Step 7: Compile the application binary and all test harnesses
      - name: Compile application binary and test suite
        # Build binary with verbose compiler output
        run: cargo build --verbose --all-targets

      # Step 8: Execute the complete 311-test QA suite across all modules
      - name: Run all 311 unit, integration, E2E, and property-based test cases
        # Execute cargo test harness with full backtraces
        run: cargo test --verbose -- --nocapture --show-output

      # Step 9: Verify Global Cargo Install Workflow
      - name: Verify Global Cargo Install Workflow
        run: cargo install --path .

      # Step 10a: Install librsvg2-bin (provides rsvg-convert) on Linux.
      # The screenshot generator shells out to rsvg-convert; without this
      # package the verification step below would silently rasterize nothing.
      # macOS/Windows equivalents exist (brew install librsvg, choco/chicken
      # installers), but to keep CI deterministic we simply pin the screenshot
      # verification step itself to Linux runners via the `if:` condition.
      - name: Install rsvg-convert (librsvg2-bin)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      # Step 10b: Verify Screenshot Generator Execution (Linux only).
      # NOTE ON DRIFT: the regenerated SVGs embed today-dated content
      # (chrono::Utc::now() seeds the stats view), so a `git diff --exit-code`
      # against tracked files would fail on every new day for reasons unrelated
      # to correctness. Instead we verify the generator exits 0 and then
      # restore the tracked files so the workspace stays byte-identical to the
      # commit under test. A real drift check belongs in a dedicated
      # date-independent regeneration workflow.
      - name: Verify Screenshot Generator Execution
        if: runner.os == 'Linux'
        run: |
          cargo run --bin generate_screenshots
          git checkout -- assets/screenshots docs/assets/screenshots

      # Step 11: Automatically clean target build cache to maintain runner disk hygiene
      - name: Clean build cache
        run: cargo clean


